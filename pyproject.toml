[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quanticdata-aliexpress-scraper"
version = "0.1.0"
description = "AliExpress scraper API for Python and the command line: product search results by keyword with sale price, original price, discount, units sold, rating, delivery dates and the Choice flag, as JSON or CSV. Free and open source; sign in with your QuanticData account, no proxies or headless browser to run."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "QuanticData", email = "hello@quanticdata.io" }]
keywords = ["aliexpress-scraper", "aliexpress-scraper-api", "aliexpress-api", "aliexpress-product-scraper", "aliexpress-price-scraper", "aliexpress-data", "aliexpress", "product-research", "dropshipping", "price-tracker", "ecommerce", "web-scraping"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.3"]

[project.scripts]
aliexpress-scraper = "quanticdata_aliexpress_scraper.__main__:run"

[project.urls]
Homepage = "https://quanticdata.io/collectors/aliexpress-scraper-api/?utm_source=github&utm_medium=pypi&utm_campaign=aliexpress-scraper"
Documentation = "https://quanticdata.io/docs/"
Source = "https://github.com/quantumproxies/aliexpress-scraper"
Issues = "https://github.com/quantumproxies/aliexpress-scraper/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"quanticdata_aliexpress_scraper" = ["spec.json", "py.typed"]
